name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours (UTC)
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure upstream remote
        run: |
          git remote add upstream https://github.com/makccr/wallpapers.git
          git fetch upstream

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream/master preferring deletions
        run: |
          set -e
          git checkout master
          if ! git merge upstream/master -m "chore: sync with upstream wallpapers"; then
            echo "Conflicts detected; removing conflicted files (ours = deletion priority)..."
            git status --porcelain | grep '^UU ' | awk '{print $2}' | xargs -r git rm -f
            git status --porcelain | grep '^UD ' | awk '{print $2}' | xargs -r git rm -f
            git status --porcelain | grep '^DU ' | awk '{print $2}' | xargs -r git rm -f
            git commit -m "chore: sync with upstream wallpapers (conflicts resolved: keep ours/deletions)"
          fi

      - name: Push changes
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
