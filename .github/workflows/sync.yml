name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 */6 * * *'  # roda a cada 6 horas (UTC)
  workflow_dispatch: {}   # permite rodar manualmente

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure upstream remote
        run: |
          git remote add upstream https://github.com/makccr/wallpapers.git
          git fetch upstream

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream/master
        run: |
          git checkout master
          git merge upstream/master --strategy-option=ours -m "chore: sync with upstream wallpapers"

      - name: Push changes
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
